[package]
name = "notifications"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
serde_json = "1.0.140"
tokio = { version = "1.44.0", features = ["full",] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4"] }
chrono = "0.4.41"
deadpool-postgres = { version = "0.14.1", features = ["rt_tokio_1"] }


# Crate compartido
shared = { path = "../shared" }

[lib]
path = "src/lib.rs"