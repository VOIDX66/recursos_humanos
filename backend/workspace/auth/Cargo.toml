[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
bcrypt = "0.17.0"  # Si usas hashing de contraseñas
chrono = { version = "0.4.41", features = ["serde"]}
deadpool-postgres = "0.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

jsonwebtoken = "9.3.1"  # Si usas JWT
tokio-postgres = "0.7"

validator = { version = "0.20.0", features = ["derive"] }

# Crate compartido
shared = { path = "../shared" }


[lib]
path = "src/lib.rs"