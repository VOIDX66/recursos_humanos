[package]
name = "contract"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
actix-files = "0.6.6"
mime = "0.3.17"
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.0", features = ["full",] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4"] }

# Crate compartido
shared = { path = "../shared" }

[lib]
path = "src/lib.rs"